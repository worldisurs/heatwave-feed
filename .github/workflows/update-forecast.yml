name: Update forecast

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch forecast and build forecast.json
        run: python fetch_forecast.py
      - name: Save forecast.json to the repository
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add forecast.json
          git diff --cached --quiet || git commit -m "Update forecast"
          git push
